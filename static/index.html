<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOH // DOWNLOADER</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050508;--bg2:#0a0a12;--surface:#0d0d18;--card:#10101e;
    --border:#2a1f4a;--purple:#7b2fff;--purple2:#9d4eff;--purple3:#c084fc;
    --cyan:#00e5ff;--text:#e8e0ff;--muted:#6b5f8a;--danger:#ff2d6b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;overflow-x:hidden;cursor:crosshair;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(123,47,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(123,47,255,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;animation:gridShift 20s linear infinite;}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(123,47,255,0.18) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 100% 100%,rgba(0,229,255,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;}
  @keyframes gridShift{from{background-position:0 0,0 0;}to{background-position:40px 40px,40px 40px;}}
  .scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);pointer-events:none;z-index:999;opacity:0.4;}
  .container{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:30px 20px 80px;}

  header{text-align:center;margin-bottom:44px;animation:bootUp 0.8s ease both;}
  .header-tag{font-family:'Orbitron',monospace;font-size:0.65rem;color:var(--purple3);letter-spacing:0.3em;margin-bottom:16px;opacity:0.7;}
  .logo-wrap{display:inline-block;position:relative;margin-bottom:8px;}
  .logo-text{font-family:'Orbitron',monospace;font-size:clamp(2.8rem,10vw,4.5rem);font-weight:900;color:var(--text);letter-spacing:0.12em;text-shadow:0 0 20px var(--purple),0 0 60px rgba(123,47,255,0.4);animation:flicker 8s ease-in-out infinite;}
  .logo-sub{font-family:'Orbitron',monospace;font-size:clamp(0.55rem,2vw,0.75rem);letter-spacing:0.5em;color:var(--purple3);margin-top:-6px;opacity:0.8;}
  .logo-wrap:hover .logo-text{animation:glitch 0.3s steps(2) infinite;}
  @keyframes glitch{0%{text-shadow:-2px 0 var(--cyan),2px 0 var(--danger);transform:translate(-1px,0);}50%{text-shadow:2px 0 var(--cyan),-2px 0 var(--danger);transform:translate(1px,0);}100%{text-shadow:0 0 20px var(--purple);transform:translate(0);}}
  @keyframes flicker{0%,95%,100%{opacity:1;}96%{opacity:0.85;}97%{opacity:1;}98%{opacity:0.9;}}

  .platforms{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:18px;}
  .badge{padding:3px 11px;border-radius:3px;font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.1em;border:1px solid;transition:all 0.2s;}
  .badge:hover{transform:translateY(-2px);filter:brightness(1.3);}
  .b-yt{color:#ff4444;border-color:rgba(255,68,68,0.4);background:rgba(255,68,68,0.06);}
  .b-tt{color:#69c9d0;border-color:rgba(105,201,208,0.4);background:rgba(105,201,208,0.06);}
  .b-ig{color:#f77737;border-color:rgba(247,119,55,0.4);background:rgba(247,119,55,0.06);}
  .b-fb{color:#6b9fff;border-color:rgba(107,159,255,0.4);background:rgba(107,159,255,0.06);}
  .b-tw{color:#00e5ff;border-color:rgba(0,229,255,0.4);background:rgba(0,229,255,0.06);}

  .input-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;margin-bottom:20px;box-shadow:0 0 0 1px rgba(123,47,255,0.1),0 8px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(123,47,255,0.1);position:relative;overflow:hidden;animation:bootUp 0.6s ease 0.1s both;}
  .input-card::before,.input-card::after{content:'';position:absolute;width:14px;height:14px;border-color:var(--purple);border-style:solid;}
  .input-card::before{top:-1px;right:-1px;border-width:2px 2px 0 0;}
  .input-card::after{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
  .input-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:0.2em;color:var(--purple3);margin-bottom:12px;display:block;}
  .input-row{display:flex;gap:8px;align-items:center;}
  .url-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:13px 16px;color:var(--text);font-family:'Cairo',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;direction:ltr;text-align:left;}
  .url-input::placeholder{color:var(--muted);}
  .url-input:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(123,47,255,0.2);}
  .paste-btn{background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:13px 15px;color:var(--muted);cursor:pointer;font-size:1rem;transition:all 0.2s;flex-shrink:0;}
  .paste-btn:hover{border-color:var(--purple3);color:var(--purple3);}
  .download-btn{width:100%;margin-top:14px;background:linear-gradient(135deg,#3a0ca3,#7b2fff,#9d4eff);background-size:200% 200%;border:none;border-radius:3px;padding:16px;color:#fff;font-family:'Orbitron',monospace;font-size:0.78rem;font-weight:700;letter-spacing:0.2em;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(123,47,255,0.5);animation:gradShift 4s ease infinite;}
  @keyframes gradShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  .download-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);transition:left 0.5s;}
  .download-btn:hover::before{left:150%;}
  .download-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(123,47,255,0.7);}
  .download-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* Progress */
  .progress-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:20px 24px;margin-bottom:20px;display:none;animation:bootUp 0.3s ease;}
  .progress-card.show{display:block;}
  .progress-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.2em;color:var(--purple3);margin-bottom:12px;}
  .progress-bar-wrap{background:var(--bg2);border-radius:3px;height:6px;overflow:hidden;margin-bottom:10px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:3px;width:0%;transition:width 0.3s;animation:shimmer 1.5s infinite;}
  @keyframes shimmer{0%{filter:brightness(1);}50%{filter:brightness(1.4);}100%{filter:brightness(1);}}
  .progress-status{font-family:'Orbitron',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;}

  /* Result */
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:none;margin-bottom:20px;box-shadow:0 0 0 1px rgba(123,47,255,0.15),0 12px 48px rgba(0,0,0,0.7);animation:bootUp 0.4s ease;position:relative;}
  .result-card.show{display:block;}
  .result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),var(--purple),transparent);}
  .result-header{padding:16px 20px;background:rgba(123,47,255,0.06);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .platform-icon{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);flex-shrink:0;}
  .result-title{font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:0.08em;color:var(--purple3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .result-thumb{width:100%;max-height:260px;object-fit:cover;display:block;filter:saturate(0.9) contrast(1.05);}
  .result-thumb-placeholder{width:100%;height:140px;background:linear-gradient(135deg,var(--bg2),var(--surface));display:flex;align-items:center;justify-content:center;font-size:3rem;border-bottom:1px solid var(--border);}
  .result-meta{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:16px;}
  .meta-item{font-family:'Orbitron',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;}
  .meta-item span{color:var(--purple3);}

  .options-section{padding:18px 20px;}
  .options-title{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.25em;color:var(--muted);margin-bottom:12px;}
  .options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
  .option-btn{background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:14px 8px;color:var(--text);cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.82rem;font-weight:700;text-align:center;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden;}
  .option-btn::before{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--purple);transition:width 0.3s;}
  .option-btn:hover::before{width:100%;}
  .option-btn:hover{border-color:var(--purple);color:var(--purple3);box-shadow:0 0 16px rgba(123,47,255,0.25);transform:translateY(-2px);}
  .option-btn.best{border-color:rgba(123,47,255,0.5);background:rgba(123,47,255,0.08);}
  .option-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .q-icon{font-size:1.2rem;}
  .q-label{font-size:0.68rem;color:var(--muted);}

  /* Download progress overlay */
  .dl-progress{margin-top:8px;display:none;}
  .dl-progress.show{display:block;}
  .dl-bar-wrap{background:var(--bg2);border-radius:2px;height:3px;overflow:hidden;margin-top:6px;}
  .dl-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));width:0%;transition:width 0.3s;}

  /* Error */
  .error-card{background:rgba(255,45,107,0.07);border:1px solid rgba(255,45,107,0.3);border-radius:4px;padding:14px 18px;color:#ff6b8a;font-size:0.85rem;display:none;margin-bottom:20px;animation:bootUp 0.3s ease;}
  .error-card.show{display:block;}

  /* History */
  .history-section{animation:bootUp 0.6s ease 0.2s both;}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .section-title{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:0.25em;color:var(--purple3);}
  .clear-btn{background:none;border:1px solid rgba(255,45,107,0.2);color:rgba(255,45,107,0.5);font-family:'Orbitron',monospace;font-size:0.55rem;letter-spacing:0.1em;cursor:pointer;padding:4px 10px;border-radius:2px;transition:all 0.2s;}
  .clear-btn:hover{border-color:var(--danger);color:var(--danger);}
  .history-list{display:flex;flex-direction:column;gap:6px;}
  .history-item{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.2s;overflow:hidden;position:relative;}
  .history-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--purple);transform:scaleY(0);transition:transform 0.2s;}
  .history-item:hover{border-color:rgba(123,47,255,0.4);background:rgba(123,47,255,0.05);}
  .history-item:hover::before{transform:scaleY(1);}
  .history-platform{font-size:1rem;flex-shrink:0;}
  .history-url{flex:1;font-size:0.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;}
  .history-time{font-family:'Orbitron',monospace;font-size:0.58rem;color:var(--border);flex-shrink:0;}
  .empty-history{text-align:center;color:var(--muted);font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.15em;padding:24px;border:1px dashed var(--border);border-radius:4px;}

  footer{text-align:center;margin-top:50px;font-family:'Orbitron',monospace;font-size:0.58rem;letter-spacing:0.2em;color:var(--border);}
  footer span{color:var(--purple3);}

  @keyframes bootUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media(max-width:480px){.options-grid{grid-template-columns:repeat(2,1fr);}}.logo-text{font-size:2.8rem;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="container">

  <header>
    <div class="header-tag">// PERSONAL DOWNLOADER //</div>
    <div class="logo-wrap">
      <div class="logo-text">MOH</div>
      <div class="logo-sub">D O W N L O A D E R</div>
    </div>
    <div class="platforms">
      <span class="badge b-yt">▶ YOUTUBE</span>
      <span class="badge b-tt">♪ TIKTOK</span>
      <span class="badge b-ig">◈ INSTAGRAM</span>
      <span class="badge b-fb">◉ FACEBOOK</span>
      <span class="badge b-tw">✦ TWITTER/X</span>
    </div>
  </header>

  <div class="input-card">
    <label class="input-label">// INSERT TARGET URL</label>
    <div class="input-row">
      <input type="url" class="url-input" id="urlInput" placeholder="https://..." autocomplete="off" spellcheck="false"/>
      <button class="paste-btn" id="pasteBtn">📋</button>
    </div>
    <button class="download-btn" id="analyzeBtn">🔍 ANALYZE TARGET</button>
  </div>

  <div class="progress-card" id="progressCard">
    <div class="progress-label">// SCANNING TARGET...</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-status" id="progressStatus">CONNECTING...</div>
  </div>

  <div class="error-card" id="errorCard">⚠ <span id="errorMsg"></span></div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="platform-icon" id="platformIcon">🎬</div>
      <div class="result-title" id="resultTitle">READY</div>
    </div>
    <div id="thumbContainer"></div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="options-section">
      <div class="options-title">// SELECT DOWNLOAD FORMAT</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="dl-progress" id="dlProgress">
        <div class="progress-status" id="dlStatus">DOWNLOADING...</div>
        <div class="dl-bar-wrap"><div class="dl-bar" id="dlBar"></div></div>
      </div>
    </div>
  </div>

  <div class="history-section">
    <div class="section-header">
      <span class="section-title">// RECENT TARGETS</span>
      <button class="clear-btn" id="clearBtn">CLEAR ALL</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <footer>BUILT FOR <span>MOH</span> // ALL RIGHTS RESERVED</footer>
</div>

<script>
const HIST_KEY = 'moh_dlr_v2';
const API = ''; // Same origin

const PLATFORM_ICONS = {
  Youtube: '▶️', TikTok: '🎵', Instagram: '📷',
  Facebook: '👤', Twitter: '🐦', X: '🐦'
};

// ── Utils ──
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; }
}
function saveHistory(url, platform) {
  let h = getHistory().filter(x => x.url !== url);
  h.unshift({ url, platform, time: Date.now() });
  if (h.length > 15) h = h.slice(0, 15);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch {}
  renderHistory();
}
function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'NOW';
  if (m < 60) return m + 'M';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'H';
  return Math.floor(h / 24) + 'D';
}
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes > 1e9) return (bytes / 1e9).toFixed(1) + 'GB';
  if (bytes > 1e6) return (bytes / 1e6).toFixed(0) + 'MB';
  return (bytes / 1e3).toFixed(0) + 'KB';
}
function formatDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ── History render ──
function renderHistory() {
  const list = document.getElementById('historyList');
  const h = getHistory();
  if (!h.length) {
    list.innerHTML = '<div class="empty-history">// NO RECORDS FOUND //</div>';
    return;
  }
  list.innerHTML = h.map(item => {
    const icon = PLATFORM_ICONS[item.platform] || '🔗';
    const short = item.url.length > 52 ? item.url.slice(0, 52) + '…' : item.url;
    return `<div class="history-item" onclick="loadHistory('${item.url.replace(/'/g,"\\'")}')">
      <span class="history-platform">${icon}</span>
      <span class="history-url">${short}</span>
      <span class="history-time">${timeAgo(item.time)}</span>
    </div>`;
  }).join('');
}

// ── UI helpers ──
function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorCard').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('progressCard').classList.remove('show');
}
function hideError() { document.getElementById('errorCard').classList.remove('show'); }

function setProgress(pct, status) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressStatus').textContent = status;
}

// ── Analyze ──
async function analyze() {
  const url = document.getElementById('urlInput').value.trim();
  hideError();
  if (!url || !url.startsWith('http')) { showError('INSERT VALID URL'); return; }

  document.getElementById('progressCard').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('analyzeBtn').disabled = true;
  setProgress(20, 'CONNECTING TO TARGET...');

  try {
    setProgress(50, 'EXTRACTING VIDEO INFO...');
    const res = await fetch(API + '/info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });

    setProgress(90, 'PROCESSING DATA...');
    const data = await res.json();

    if (data.error) { showError(data.error); return; }

    setProgress(100, 'DONE');
    setTimeout(() => {
      document.getElementById('progressCard').classList.remove('show');
      showResult(data, url);
    }, 400);

    saveHistory(url, data.platform);

  } catch (e) {
    showError('CONNECTION FAILED — Is the server running?');
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
  }
}

// ── Show result ──
function showResult(data, url) {
  document.getElementById('platformIcon').textContent = PLATFORM_ICONS[data.platform] || '🎬';
  document.getElementById('resultTitle').textContent = data.title || 'VIDEO';

  // Thumbnail
  const tc = document.getElementById('thumbContainer');
  if (data.thumbnail) {
    tc.innerHTML = `<img class="result-thumb" src="${data.thumbnail}" onerror="this.parentElement.innerHTML='<div class=result-thumb-placeholder>🎬</div>'" alt="thumb">`;
  } else {
    tc.innerHTML = `<div class="result-thumb-placeholder">🎬</div>`;
  }

  // Meta
  const meta = document.getElementById('resultMeta');
  let metaHtml = '';
  if (data.platform) metaHtml += `<div class="meta-item">PLATFORM: <span>${data.platform.toUpperCase()}</span></div>`;
  if (data.duration) metaHtml += `<div class="meta-item">DURATION: <span>${formatDuration(data.duration)}</span></div>`;
  if (data.formats?.length) metaHtml += `<div class="meta-item">FORMATS: <span>${data.formats.length}</span></div>`;
  meta.innerHTML = metaHtml;

  // Format options
  const grid = document.getElementById('optionsGrid');
  const formats = data.formats || [];

  let html = '';

  // Best quality button always first
  html += `<button class="option-btn best" onclick="downloadVideo('${url.replace(/'/g,"\\'")}', 'bestvideo+bestaudio/best')">
    <span class="q-icon">✨</span><span>BEST</span><span class="q-label">أعلى جودة</span>
  </button>`;

  formats.forEach(f => {
    const size = formatSize(f.filesize);
    html += `<button class="option-btn" onclick="downloadVideo('${url.replace(/'/g,"\\'")}', '${f.format_id}')">
      <span class="q-icon">${f.type === 'audio' ? '🎵' : '🎬'}</span>
      <span>${f.label}</span>
      <span class="q-label">${size || f.ext}</span>
    </button>`;
  });

  grid.innerHTML = html;
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Download ──
async function downloadVideo(url, formatId) {
  const dlProgress = document.getElementById('dlProgress');
  const dlBar = document.getElementById('dlBar');
  const dlStatus = document.getElementById('dlStatus');

  dlProgress.classList.add('show');
  dlStatus.textContent = 'PREPARING DOWNLOAD...';
  dlBar.style.width = '30%';

  // Disable all option buttons
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  try {
    dlBar.style.width = '60%';
    dlStatus.textContent = 'DOWNLOADING — PLEASE WAIT...';

    const res = await fetch(API + '/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, format_id: formatId })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Download failed');
    }

    dlBar.style.width = '90%';
    dlStatus.textContent = 'SAVING FILE...';

    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const nameMatch = disposition.match(/filename="?([^"]+)"?/);
    const filename = nameMatch ? nameMatch[1] : 'moh-download.mp4';

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);

    dlBar.style.width = '100%';
    dlStatus.textContent = '✅ DOWNLOAD COMPLETE!';
    setTimeout(() => {
      dlProgress.classList.remove('show');
      dlBar.style.width = '0%';
    }, 3000);

  } catch (e) {
    dlStatus.textContent = '⚠ ERROR: ' + e.message;
    dlBar.style.width = '0%';
  } finally {
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
  }
}

function loadHistory(url) {
  document.getElementById('urlInput').value = url;
  analyze();
}

// ── Events ──
document.getElementById('analyzeBtn').addEventListener('click', analyze);
document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
document.getElementById('urlInput').addEventListener('paste', () => {
  setTimeout(() => {
    const v = document.getElementById('urlInput').value.trim();
    if (v.startsWith('http')) analyze();
  }, 150);
});
document.getElementById('pasteBtn').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    document.getElementById('urlInput').value = t;
    if (t.startsWith('http')) analyze();
  } catch { document.getElementById('urlInput').focus(); }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  try { localStorage.removeItem(HIST_KEY); } catch {}
  renderHistory();
});

renderHistory();
</script>
